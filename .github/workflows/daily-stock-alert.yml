name: Weekly NIFTY 50 Stock Alert

on:
  schedule:
    # 13:00 UTC = 18:30 IST every Friday.
    # GitHub Actions may start scheduled workflows slightly later.
    - cron: "0 13 * * 5"

permissions:
  contents: read

jobs:
  screen-stocks:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run NIFTY 50 screening and send email
        env:
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "465"
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_RECIPIENT: ${{ secrets.ALERT_RECIPIENT }}
        run: python main.py
